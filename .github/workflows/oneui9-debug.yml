name: One UI 9 Shizuku debug APK

on:
  push:
    branches:
      - fix/oneui9-app-discovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # ubuntu-latest already has Android command-line tools installed.
      # setup-android@v3 tries to install obsolete package 'tools' and fails.
      - name: Install Android SDK 36 and NDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456"
          echo 'android.sdk.channel=3' >> gradle.properties

      - name: Build manager debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :manager:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shizuku-oneui9-debug-apk
          path: manager/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
