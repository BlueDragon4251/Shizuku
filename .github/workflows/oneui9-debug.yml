name: One UI 9 Shizuku debug APK

on:
  push:
    branches:
      - fix/oneui9-app-discovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Test platform API signature resolution
        shell: bash
        run: |
          test_classes="$(mktemp -d)"
          trap 'rm -rf "$test_classes"' EXIT
          javac -d "$test_classes" \
            common/src/main/java/moe/shizuku/common/util/PlatformApiReflection.java \
            common/src/test/java/moe/shizuku/common/util/PlatformApiReflectionTest.java
          java -cp "$test_classes" moe.shizuku.common.util.PlatformApiReflectionTest

      - name: Check diagnostic PowerShell script syntax
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'diagnostics/collect-shizuku-logs.ps1'),
            [ref]$parseTokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            throw ($parseErrors | Out-String)
          }

      # ubuntu-latest already has Android command-line tools installed.
      # setup-android@v3 tries to install obsolete package 'tools' and fails.
      - name: Install Android SDK 36 and NDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456"
          echo 'android.sdk.channel=3' >> gradle.properties

      - name: Build manager debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :manager:assembleDebug --stacktrace --no-daemon

      - name: Verify APK package and signature
        shell: bash
        run: |
          shopt -s nullglob
          apk_files=(manager/build/outputs/apk/debug/*.apk)
          if (( ${#apk_files[@]} != 1 )); then
            echo "Expected exactly one debug APK, found ${#apk_files[@]}" >&2
            exit 1
          fi

          apk_file="${apk_files[0]}"
          build_tools_dir="$ANDROID_HOME/build-tools/36.0.0"
          artifact_dir="out/oneui9-debug"
          mkdir -p "$artifact_dir"

          "$build_tools_dir/aapt" dump badging "$apk_file" > "$artifact_dir/apk-metadata.txt"
          package_id="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$artifact_dir/apk-metadata.txt")"
          if [[ "$package_id" != "moe.shizuku.privileged.api" ]]; then
            echo "Unexpected APK package: $package_id" >&2
            exit 1
          fi
          "$build_tools_dir/apksigner" verify --verbose --print-certs "$apk_file" \
            | tee "$artifact_dir/apk-signature.txt"
          git rev-parse HEAD > "$artifact_dir/source-revision.txt"
          cp -- "$apk_file" "$artifact_dir/"
          cd "$artifact_dir"
          sha256sum -- *.apk > SHA256SUMS

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shizuku-oneui9-debug-apk
          path: out/oneui9-debug/
          if-no-files-found: error
          retention-days: 14

      - name: Publish diagnostic prerelease for direct downloads
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_tag="oneui9-diagnostics-${GITHUB_SHA:0:8}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" --repo "$GITHUB_REPOSITORY" \
              out/oneui9-debug/* diagnostics/collect-shizuku-logs.ps1 --clobber
          else
            gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Shizuku One UI 9 diagnostics (${GITHUB_SHA:0:8})" \
              --notes-file diagnostics/README.md \
              out/oneui9-debug/* diagnostics/collect-shizuku-logs.ps1
          fi
