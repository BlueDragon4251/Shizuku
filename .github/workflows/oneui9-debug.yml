name: One UI 9 Shizuku debug APK

on:
  push:
    branches:
      - fix/oneui9-app-discovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456"

      - name: Build manager debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :manager:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shizuku-oneui9-debug-apk
          path: manager/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
